# Fabrique l'installateur Windows et le publie dans la Release GitHub
# dès que la version de package.json change sur main (nouveau déploiement).
# L'étiquette vX.Y.Z est créée automatiquement avec la Release.
# Les postes installés se mettent ensuite à jour seuls.
name: Publication Windows

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version à publier
        id: v
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Rien à faire si la Release existe avec son fichier de mise à jour (latest.yml).
          if gh release view "v$VERSION" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "latest.yml"; then
            echo "La Release v$VERSION existe déjà : rien à publier."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.v.outputs.skip == 'false'
        with:
          node-version: 22
          cache: npm

      - name: Installation des dépendances
        if: steps.v.outputs.skip == 'false'
        run: npm ci

      - name: Tests
        if: steps.v.outputs.skip == 'false'
        run: npm test

      # La Release est créée avant l'envoi des fichiers : sans cela, les envois en
      # parallèle tentent de la créer deux fois et l'un d'eux échoue.
      - name: Préparer la Release
        if: steps.v.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="v${{ steps.v.outputs.version }}"
          if ! gh release view "$V" > /dev/null 2>&1; then
            gh release create "$V" --target "${{ github.sha }}" --title "$V" --notes-file build/release-notes.md
          fi

      - name: Fabrication et publication
        if: steps.v.outputs.skip == 'false'
        shell: bash
        run: |
          set -o pipefail
          if ! npx electron-builder --win --publish always 2>&1 | tee build.log; then
            grep -v "^\s*at " build.log | tail -25 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
