name: Compiler AGOA CG (Windows)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests
        run: npm test

      - name: Compiler l'installateur et la version portable
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Conserver les fichiers compilés
        uses: actions/upload-artifact@v4
        with:
          name: AGOA-CG-windows
          path: |
            dist/AGOA-CG-Setup-*.exe
            dist/AGOA-CG-Portable-*.exe
          if-no-files-found: error

      - name: Publier une version (étiquette v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AGOA-CG-Setup-*.exe
            dist/AGOA-CG-Portable-*.exe
          generate_release_notes: true
